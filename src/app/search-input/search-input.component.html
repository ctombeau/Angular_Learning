<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h2>SEARCH INPUT WITH SIGNAL</h2>
    </div>
    <form ngForm="form" >
        <input class="form-control"
            placeholder="Recherche par nom ou prénom"
            [value]="searchText()"
            (input)="onSearch($event)" type="text" name="prenom" ngModel/>
    </form>

 <ul>
    <li *ngFor="let p of filteredPersons()">{{p.nom}} {{p.prenom}} {{p.age}}</li>
 </ul>
</body>
</html>
